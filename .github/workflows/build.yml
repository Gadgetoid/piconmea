name: Build

on:
  push:
  pull_request:

env:
  PICO_SDK_VERSION: 2.3.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - pico2_w
          - pimoroni_pico_lipo2xl_w
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          submodules: true

      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.2.Rel1'

      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=${{ matrix.board }}
          cmake --build build --parallel
          cp build/piconmea.uf2 piconmea-${{ matrix.board }}.uf2

      - uses: actions/upload-artifact@v7
        with:
          name: piconmea-${{ matrix.board }}
          path: piconmea-${{ matrix.board }}.uf2

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: piconmea-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in piconmea-*.uf2; do
            mv "$file" "piconmea-${GITHUB_REF_NAME}-${file#piconmea-}"
          done
          gh release create "$GITHUB_REF_NAME" piconmea-*.uf2 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
