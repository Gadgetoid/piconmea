<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoGPS Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --background: #f6f6f4;
    --panel: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --border: #d9d9d4;
    --accent: #2563eb;
    --good: #15803d;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.4 system-ui, sans-serif;
    color: var(--text);
    background: var(--background);
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; }
  section { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--background);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.active { background: var(--text); border-color: var(--text); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type=number] { width: 80px; font: inherit; padding: 4px 6px; }
  .status { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  .status span:nth-child(odd) { color: var(--muted); }
  .on { color: var(--good); font-weight: 600; }
  .off { color: var(--muted); }
  #position { font-family: ui-monospace, monospace; font-size: 12px; }
  #log {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    height: 160px;
    overflow-y: auto;
    white-space: pre;
  }
  #map { height: 100vh; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
    #map { height: 60vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>PicoGPS Simulator</h1>

  <section>
    <h2>Device</h2>
    <div class="row">
      <button id="connect" class="primary">Connect</button>
      <button id="simulate" disabled>Simulate</button>
    </div>
    <div class="status">
      <span>USB</span><span id="usb-status" class="off">disconnected</span>
      <span>Mode</span><span id="sim-status" class="off">real GPS</span>
      <span>Bluetooth</span><span id="bt-status" class="off">no client</span>
      <span>Battery</span><span id="battery-status" class="off">-</span>
    </div>
  </section>

  <section>
    <h2>Map tool</h2>
    <div class="row">
      <button id="tool-place" class="active">Place</button>
      <button id="tool-draw">Draw path</button>
    </div>
    <p class="hint" id="tool-hint">Click the map to set a fixed position.</p>
  </section>

  <section>
    <h2>Path</h2>
    <div class="row">
      <button id="undo">Undo point</button>
      <button id="clear">Clear</button>
      <button id="import-button">Import track</button>
      <input id="import" type="file" accept=".gpx,.plt" hidden>
    </div>
    <p class="hint" id="path-info">No path.</p>
  </section>

  <section id="track-section" hidden>
    <h2>Track</h2>
    <div class="status" id="track-stats"></div>
    <div class="legend" id="track-legend"></div>
  </section>

  <section>
    <h2>Playback</h2>
    <div class="row">
      <button id="units-mph">mph</button>
      <button id="units-kmh">km/h</button>
    </div>
    <div class="row">
      <label>Speed <input id="speed" type="number" min="0.5" step="0.5" value="3"> <span id="speed-unit">mph</span></label>
    </div>
    <div class="row">
      <button data-preset="0">Walk</button>
      <button data-preset="1">Cycle</button>
      <button data-preset="2">Drive</button>
      <button data-preset="3">Motorway</button>
    </div>
    <div class="row">
      <button id="play" class="primary" disabled>Play</button>
      <button id="stop" disabled>Stop</button>
      <label><input id="loop" type="checkbox"> Loop</label>
    </div>
    <p class="hint" id="progress"></p>
  </section>

  <section>
    <h2>Position</h2>
    <div id="position">-</div>
  </section>

  <section>
    <h2>Serial log</h2>
    <div id="log"></div>
  </section>
</aside>
<div id="map"></div>

<script>
const UPDATE_INTERVAL_MS = 1000;
const LOG_LINES = 200;
const EARTH_RADIUS = 6371000;
const STORAGE_KEY = "picogps-path";
const BATTERY_POLL_MS = 10000;
const SPEED_WINDOW_S = 5;
const SEGMENT_GAP_S = 60;
const MOVING_MPS = 0.45;
const JUMP_MPS = 134;
const MPS_TO_KNOTS = 1.943844;
const MPS_TO_KMH = 3.6;
const UNITS_KEY = "picogps-units";
const SPEED_UNITS = {
  mph: { label: "mph", perMps: 2.236936, presets: [3, 10, 30, 70], bands: [0, 20, 40, 60, 80] },
  kmh: { label: "km/h", perMps: 3.6, presets: [5, 15, 50, 110], bands: [0, 30, 60, 90, 120] }
};
const SPEED_BAND_COLOURS = ["#2563eb", "#16a34a", "#eab308", "#f97316", "#dc2626"];
const FEET_TO_METRES = 0.3048;
const OZI_NO_ALTITUDE = -777;
const DELPHI_EPOCH_MS = Date.UTC(1899, 11, 30);
const DAY_MS = 86400000;

const map = L.map("map").setView([52.205, 0.119], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const PATH_STYLE = { color: "#2563eb", weight: 4, opacity: 1, dashArray: null };
const TRACK_PATH_STYLE = { color: "#64748b", weight: 2, opacity: 0.6, dashArray: "4 6" };
const pathLine = L.polyline([], PATH_STYLE).addTo(map);
const speedLayer = L.layerGroup().addTo(map);
const simMarker = L.circleMarker([0, 0], { radius: 8, color: "#b91c1c", fillOpacity: 0.9 });
const realMarker = L.circleMarker([0, 0], { radius: 7, color: "#15803d", fillOpacity: 0.6 }).bindTooltip("Real GPS");

const elements = Object.fromEntries([...document.querySelectorAll("[id]")].map(element => [element.id, element]));

let port = null;
let writer = null;
let reader = null;
let simulating = false;
let tool = "place";
let path = [];
let fixedPosition = null;
let playing = false;
let travelled = 0;
let lastTick = 0;
let lastCourse = 0;
let timer = null;
let batteryTimer = null;
let trackPoints = [];
let units = SPEED_UNITS.mph;
let lastShown = null;

function toRadians(degrees) { return degrees * Math.PI / 180; }
function toDegrees(radians) { return radians * 180 / Math.PI; }

function distance(a, b) {
  const deltaLatitude = toRadians(b.lat - a.lat);
  const deltaLongitude = toRadians(b.lng - a.lng);
  const h = Math.sin(deltaLatitude / 2) ** 2 + Math.cos(toRadians(a.lat)) * Math.cos(toRadians(b.lat)) * Math.sin(deltaLongitude / 2) ** 2;
  return 2 * EARTH_RADIUS * Math.asin(Math.sqrt(h));
}

function bearing(a, b) {
  const y = Math.sin(toRadians(b.lng - a.lng)) * Math.cos(toRadians(b.lat));
  const x = Math.cos(toRadians(a.lat)) * Math.sin(toRadians(b.lat)) - Math.sin(toRadians(a.lat)) * Math.cos(toRadians(b.lat)) * Math.cos(toRadians(b.lng - a.lng));
  return (toDegrees(Math.atan2(y, x)) + 360) % 360;
}

function pathLength() {
  let total = 0;
  for (let i = 1; i < path.length; i++) total += distance(path[i - 1], path[i]);
  return total;
}

function pointAlongPath(target) {
  let covered = 0;
  for (let i = 1; i < path.length; i++) {
    const segment = distance(path[i - 1], path[i]);
    if (covered + segment >= target && segment > 0) {
      const fraction = (target - covered) / segment;
      return {
        position: L.latLng(path[i - 1].lat + (path[i].lat - path[i - 1].lat) * fraction, path[i - 1].lng + (path[i].lng - path[i - 1].lng) * fraction),
        course: bearing(path[i - 1], path[i])
      };
    }
    covered += segment;
  }
  return { position: path[path.length - 1], course: lastCourse };
}

function checksum(body) {
  let value = 0;
  for (const character of body) value ^= character.charCodeAt(0);
  return value.toString(16).toUpperCase().padStart(2, "0");
}

function sentence(body) {
  return `$${body}*${checksum(body)}\r\n`;
}

function formatCoordinate(value, degreeDigits, positive, negative) {
  const hemisphere = value >= 0 ? positive : negative;
  const absolute = Math.abs(value);
  const degrees = Math.floor(absolute);
  const minutes = (absolute - degrees) * 60;
  return `${String(degrees).padStart(degreeDigits, "0")}${minutes.toFixed(4).padStart(7, "0")},${hemisphere}`;
}

function formatSpeed(metresPerSecond, digits) {
  return `${(metresPerSecond * units.perMps).toFixed(digits)} ${units.label}`;
}

function nmeaSentences(position, speedMps, course) {
  const now = new Date();
  const pad = value => String(value).padStart(2, "0");
  const time = `${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}.00`;
  const date = `${pad(now.getUTCDate())}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCFullYear() % 100)}`;
  const latitude = formatCoordinate(position.lat, 2, "N", "S");
  const longitude = formatCoordinate(position.lng, 3, "E", "W");
  const knots = (speedMps * MPS_TO_KNOTS).toFixed(2);
  const heading = course.toFixed(2);
  return [
    sentence(`GPGGA,${time},${latitude},${longitude},1,08,1.0,10.0,M,47.0,M,,`),
    sentence("GPGSA,A,3,02,05,08,10,13,15,18,23,,,,,1.8,1.0,1.5"),
    sentence(`GPRMC,${time},A,${latitude},${longitude},${knots},${heading},${date},,,A`),
    sentence(`GPVTG,${heading},T,,M,${knots},N,${(speedMps * MPS_TO_KMH).toFixed(2)},K,A`)
  ].join("");
}

function log(text, direction) {
  const lines = elements.log.textContent.split("\n").filter(Boolean);
  for (const line of text.split(/\r?\n/).filter(Boolean)) lines.push(`${direction} ${line}`);
  elements.log.textContent = lines.slice(-LOG_LINES).join("\n") + "\n";
  elements.log.scrollTop = elements.log.scrollHeight;
}

async function send(text, quiet) {
  if (!writer) return;
  await writer.write(text);
  if (!quiet) log(text, ">");
}

function setStatus(element, on, onText, offText) {
  element.textContent = on ? onText : offText;
  element.className = on ? "on" : "off";
}

function handleLine(line) {
  const status = line.match(/^\$PPNM,STATUS,(\d),(\d)\*/);
  if (status) {
    simulating = status[1] === "1";
    setStatus(elements["sim-status"], simulating, "simulating", "real GPS");
    setStatus(elements["bt-status"], status[2] === "1", "client connected", "no client");
    elements.simulate.classList.toggle("active", simulating);
    log(line, "<");
    if (!simulating) stopPlayback();
    return;
  }
  const battery = line.match(/^\$PPNM,BATTERY,(\d*),(\d*),(\d*)\*/);
  if (battery) {
    elements["battery-status"].textContent = battery[1] ? `${battery[2]}% (${(Number(battery[1]) / 1000).toFixed(2)} V)${battery[3] === "1" ? ", USB power" : ""}` : "not supported";
    elements["battery-status"].className = battery[1] ? "on" : "off";
    return;
  }
  const rmc = line.match(/^\$G.RMC,[^,]*,A,(\d{2})(\d{2}\.\d+),([NS]),(\d{3})(\d{2}\.\d+),([EW])/);
  if (rmc && !simulating) {
    const latitude = (Number(rmc[1]) + Number(rmc[2]) / 60) * (rmc[3] === "S" ? -1 : 1);
    const longitude = (Number(rmc[4]) + Number(rmc[5]) / 60) * (rmc[6] === "W" ? -1 : 1);
    realMarker.setLatLng([latitude, longitude]).addTo(map);
  }
}

async function readLoop() {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable).catch(() => {});
  reader = decoder.readable.getReader();
  let buffer = "";
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split("\n");
      buffer = lines.pop();
      lines.map(line => line.trim()).filter(Boolean).forEach(handleLine);
    }
  } catch (error) {
    log(String(error), "!");
  }
  await disconnect();
}

async function connect() {
  if (!("serial" in navigator)) {
    alertInLog("WebSerial is not supported in this browser. Use Chrome or Edge.");
    return;
  }
  port = await navigator.serial.requestPort();
  await port.open({ baudRate: 115200 });
  await port.setSignals({ dataTerminalReady: true });
  const encoder = new TextEncoderStream();
  encoder.readable.pipeTo(port.writable).catch(() => {});
  writer = encoder.writable.getWriter();
  setStatus(elements["usb-status"], true, "connected", "disconnected");
  elements.connect.textContent = "Disconnect";
  elements.simulate.disabled = false;
  updatePlayButtons();
  readLoop();
  await send(sentence("PPNM,STATUS"));
  await send(sentence("PPNM,BATTERY"), true);
  batteryTimer = setInterval(() => send(sentence("PPNM,BATTERY"), true), BATTERY_POLL_MS);
}

async function disconnect() {
  if (!port) return;
  const closing = port;
  port = null;
  clearInterval(batteryTimer);
  stopPlayback();
  try {
    await send(sentence("PPNM,SIM,0"));
    writer.releaseLock();
    await reader.cancel();
    await closing.close();
  } catch (error) {
  }
  writer = null;
  reader = null;
  simulating = false;
  setStatus(elements["usb-status"], false, "connected", "disconnected");
  setStatus(elements["sim-status"], false, "simulating", "real GPS");
  setStatus(elements["bt-status"], false, "client connected", "no client");
  elements["battery-status"].textContent = "-";
  elements["battery-status"].className = "off";
  elements.connect.textContent = "Connect";
  elements.simulate.disabled = true;
  elements.simulate.classList.remove("active");
  updatePlayButtons();
}

function alertInLog(message) {
  log(message, "!");
}

async function setSimulating(on) {
  if (on === simulating) return;
  await send(sentence(`PPNM,SIM,${on ? 1 : 0}`));
}

function currentSpeedMps() {
  return Math.max(0.5, Number(elements.speed.value) || units.presets[0]) / units.perMps;
}

function updatePathInfo() {
  pathLine.setLatLngs(path);
  const length = pathLength();
  elements["path-info"].textContent = path.length ? `${path.length} points, ${(length / 1000).toFixed(2)} km` : "No path.";
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(path.map(point => [point.lat, point.lng]))); } catch (error) {}
  updatePlayButtons();
}

function updatePlayButtons() {
  elements.play.disabled = !writer || path.length < 2;
  elements.play.textContent = playing ? "Pause" : "Play";
  elements.stop.disabled = !playing && travelled === 0;
}

function showPosition(position, speedMps, course) {
  lastShown = { position, speedMps, course };
  simMarker.setLatLng(position).addTo(map);
  elements.position.textContent = `${position.lat.toFixed(6)}, ${position.lng.toFixed(6)}\n${formatSpeed(speedMps, 1)}, ${course.toFixed(0)}°`;
}

async function tick() {
  const now = performance.now();
  const elapsed = (now - lastTick) / 1000;
  lastTick = now;

  let position = fixedPosition;
  let speedMps = 0;
  let course = lastCourse;

  if (playing) {
    const total = pathLength();
    travelled += currentSpeedMps() * elapsed;
    if (travelled >= total) {
      if (elements.loop.checked) {
        travelled = travelled % total;
      } else {
        travelled = total;
        playing = false;
        updatePlayButtons();
      }
    }
    const point = pointAlongPath(travelled);
    position = point.position;
    course = point.course;
    speedMps = playing ? currentSpeedMps() : 0;
    fixedPosition = position;
    elements.progress.textContent = `${(travelled / 1000).toFixed(2)} of ${(total / 1000).toFixed(2)} km`;
  }

  lastCourse = course;
  if (!position) return;
  showPosition(position, speedMps, course);
  if (simulating) await send(nmeaSentences(position, speedMps, course), true);
}

function startTimer() {
  if (timer) return;
  lastTick = performance.now();
  timer = setInterval(tick, UPDATE_INTERVAL_MS);
}

async function togglePlayback() {
  if (path.length < 2) return;
  playing = !playing;
  if (playing) {
    await setSimulating(true);
    lastTick = performance.now();
  }
  updatePlayButtons();
  startTimer();
  tick();
}

function stopPlayback() {
  playing = false;
  travelled = 0;
  elements.progress.textContent = "";
  updatePlayButtons();
}

function setTool(name) {
  tool = name;
  elements["tool-place"].classList.toggle("active", name === "place");
  elements["tool-draw"].classList.toggle("active", name === "draw");
  elements["tool-hint"].textContent = name === "place" ? "Click the map to set a fixed position." : "Click the map to add points to the path.";
}

map.on("click", async event => {
  if (tool === "draw") {
    if (trackPoints.length) clearTrack();
    path.push(event.latlng);
    updatePathInfo();
    return;
  }
  playing = false;
  updatePlayButtons();
  fixedPosition = event.latlng;
  await setSimulating(true);
  startTimer();
  tick();
});

function parsePlt(text) {
  return text.split(/\r?\n/).slice(6).map(line => line.split(",").map(field => field.trim())).filter(fields => fields.length >= 2 && Number.isFinite(Number(fields[0])) && Number.isFinite(Number(fields[1]))).map(fields => {
    const feet = Number(fields[3]);
    const days = Number(fields[4]);
    return {
      lat: Number(fields[0]),
      lng: Number(fields[1]),
      newSegment: fields[2] === "1",
      altitude: Number.isFinite(feet) && feet !== OZI_NO_ALTITUDE ? feet * FEET_TO_METRES : null,
      time: Number.isFinite(days) && days > 0 ? new Date(DELPHI_EPOCH_MS + days * DAY_MS) : null
    };
  });
}

function parseGpx(text) {
  const documentNode = new DOMParser().parseFromString(text, "application/xml");
  const points = [...documentNode.querySelectorAll("trkpt, rtept")];
  const source = points.length ? points : [...documentNode.querySelectorAll("wpt")];
  return source.map(point => {
    const time = point.querySelector("time")?.textContent;
    const elevation = point.querySelector("ele")?.textContent;
    return {
      lat: Number(point.getAttribute("lat")),
      lng: Number(point.getAttribute("lon")),
      newSegment: point.parentElement?.tagName === "trkseg" && point.previousElementSibling === null,
      altitude: elevation ? Number(elevation) : null,
      time: time ? new Date(time) : null
    };
  });
}

function isBreak(points, index) {
  const previous = points[index - 1];
  const current = points[index];
  if (current.newSegment || !previous.time || !current.time) return true;
  const seconds = (current.time - previous.time) / 1000;
  if (seconds > SEGMENT_GAP_S) return true;
  return distance(previous, current) / Math.max(seconds, 1) > JUMP_MPS;
}

function smoothedSpeed(points, index) {
  let covered = 0;
  for (let end = index + 1; end < points.length && !isBreak(points, end); end++) {
    covered += distance(points[end - 1], points[end]);
    const seconds = (points[end].time - points[index].time) / 1000;
    if (seconds >= SPEED_WINDOW_S || end === points.length - 1 || isBreak(points, end + 1)) {
      return seconds > 0 ? covered / seconds : 0;
    }
  }
  return 0;
}

function speedColour(metresPerSecond) {
  const speed = metresPerSecond * units.perMps;
  const bands = units.bands;
  for (let i = 1; i < bands.length; i++) {
    if (speed <= bands[i]) {
      const fraction = (speed - bands[i - 1]) / (bands[i] - bands[i - 1]);
      const lower = SPEED_BAND_COLOURS[i - 1];
      const upper = SPEED_BAND_COLOURS[i];
      const channel = offset => Math.round(parseInt(lower.slice(offset, offset + 2), 16) * (1 - fraction) + parseInt(upper.slice(offset, offset + 2), 16) * fraction);
      return `rgb(${channel(1)}, ${channel(3)}, ${channel(5)})`;
    }
  }
  return SPEED_BAND_COLOURS[SPEED_BAND_COLOURS.length - 1];
}

function formatTime(date) {
  return date ? date.toISOString().slice(11, 19) : "-";
}

function formatDuration(seconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor(seconds % 3600 / 60);
  const remainder = Math.round(seconds % 60);
  return hours ? `${hours}h ${String(minutes).padStart(2, "0")}m` : `${minutes}m ${String(remainder).padStart(2, "0")}s`;
}

function trackStatistics(points) {
  let recordedDistance = 0;
  let recordedSeconds = 0;
  let movingDistance = 0;
  let movingSeconds = 0;
  let maximumSpeed = 0;
  for (let i = 1; i < points.length; i++) {
    if (isBreak(points, i)) continue;
    const metres = distance(points[i - 1], points[i]);
    const seconds = (points[i].time - points[i - 1].time) / 1000;
    recordedDistance += metres;
    recordedSeconds += seconds;
    if (seconds > 0 && metres / seconds > MOVING_MPS) {
      movingDistance += metres;
      movingSeconds += seconds;
    }
    maximumSpeed = Math.max(maximumSpeed, smoothedSpeed(points, i - 1));
  }
  const altitudes = points.map(point => point.altitude).filter(altitude => altitude !== null);
  const timed = points.filter(point => point.time);
  return {
    points: points.length,
    distance: recordedDistance,
    recordedSeconds,
    movingSeconds,
    averageSpeed: recordedSeconds ? recordedDistance / recordedSeconds : 0,
    movingAverageSpeed: movingSeconds ? movingDistance / movingSeconds : 0,
    maximumSpeed,
    lowest: altitudes.length ? Math.min(...altitudes) : null,
    highest: altitudes.length ? Math.max(...altitudes) : null,
    start: timed[0]?.time,
    end: timed[timed.length - 1]?.time
  };
}

function showTrackStatistics(stats) {
  const rows = [
    ["Points", stats.points],
    ["Start", stats.start ? `${stats.start.toISOString().slice(0, 10)} ${formatTime(stats.start)}` : "-"],
    ["End", stats.end ? `${stats.end.toISOString().slice(0, 10)} ${formatTime(stats.end)}` : "-"],
    ["Distance", `${(stats.distance / 1000).toFixed(2)} km`],
    ["Recorded", formatDuration(stats.recordedSeconds)],
    ["Moving", formatDuration(stats.movingSeconds)],
    ["Average", formatSpeed(stats.averageSpeed, 1)],
    ["Moving avg", formatSpeed(stats.movingAverageSpeed, 1)],
    ["Max", formatSpeed(stats.maximumSpeed, 1)],
    ["Altitude", stats.lowest === null ? "-" : `${stats.lowest.toFixed(0)}-${stats.highest.toFixed(0)} m`]
  ];
  elements["track-stats"].replaceChildren(...rows.flatMap(([label, value]) => {
    const name = document.createElement("span");
    const content = document.createElement("span");
    name.textContent = label;
    content.textContent = value;
    return [name, content];
  }));
  elements["track-legend"].replaceChildren(...units.bands.map((speed, index) => {
    const item = document.createElement("span");
    const swatch = document.createElement("i");
    swatch.style.background = SPEED_BAND_COLOURS[index];
    item.append(swatch, `${speed}${index === units.bands.length - 1 ? "+" : ""} ${units.label}`);
    return item;
  }));
  elements["track-section"].hidden = false;
}

function drawTrack(points) {
  speedLayer.clearLayers();
  for (let i = 1; i < points.length; i++) {
    if (isBreak(points, i)) continue;
    const speed = smoothedSpeed(points, i - 1);
    const altitude = points[i - 1].altitude === null ? "" : `, ${points[i - 1].altitude.toFixed(0)} m`;
    L.polyline([points[i - 1], points[i]], { color: speedColour(speed), weight: 5, opacity: 0.9 })
      .bindTooltip(`${formatTime(points[i - 1].time)}, ${formatSpeed(speed, 0)}${altitude}`, { sticky: true })
      .addTo(speedLayer);
  }
}

function clearTrack() {
  trackPoints = [];
  speedLayer.clearLayers();
  pathLine.setStyle(PATH_STYLE);
  elements["track-section"].hidden = true;
}

function setUnits(key) {
  const speed = currentSpeedMps();
  units = SPEED_UNITS[key] || SPEED_UNITS.mph;
  elements.speed.value = (speed * units.perMps).toFixed(1).replace(/\.0$/, "");
  elements["speed-unit"].textContent = units.label;
  elements["units-mph"].classList.toggle("active", units === SPEED_UNITS.mph);
  elements["units-kmh"].classList.toggle("active", units === SPEED_UNITS.kmh);
  try { localStorage.setItem(UNITS_KEY, key); } catch (error) {}
  if (trackPoints.length) {
    drawTrack(trackPoints);
    showTrackStatistics(trackStatistics(trackPoints));
  }
  if (lastShown) showPosition(lastShown.position, lastShown.speedMps, lastShown.course);
}

function importTrack(name, text) {
  const points = (name.toLowerCase().endsWith(".plt") ? parsePlt(text) : parseGpx(text)).filter(point => Number.isFinite(point.lat) && Number.isFinite(point.lng));
  clearTrack();
  path = points.map(point => L.latLng(point.lat, point.lng));
  stopPlayback();
  updatePathInfo();
  if (points.some(point => point.time)) {
    trackPoints = points;
    pathLine.setStyle(TRACK_PATH_STYLE);
    drawTrack(points);
    showTrackStatistics(trackStatistics(points));
  }
  if (path.length) map.fitBounds(pathLine.getBounds(), { padding: [40, 40] });
}

elements.connect.addEventListener("click", () => (port ? disconnect() : connect().catch(error => log(String(error), "!"))));
elements.simulate.addEventListener("click", () => setSimulating(!simulating));
elements["tool-place"].addEventListener("click", () => setTool("place"));
elements["tool-draw"].addEventListener("click", () => setTool("draw"));
elements.undo.addEventListener("click", () => { clearTrack(); path.pop(); updatePathInfo(); });
elements.clear.addEventListener("click", () => { clearTrack(); path = []; stopPlayback(); updatePathInfo(); });
elements["import-button"].addEventListener("click", () => elements.import.click());
elements.import.addEventListener("change", async () => {
  const file = elements.import.files[0];
  if (file) importTrack(file.name, await file.text());
  elements.import.value = "";
});
elements.play.addEventListener("click", togglePlayback);
elements.stop.addEventListener("click", stopPlayback);
document.querySelectorAll("[data-preset]").forEach(button => button.addEventListener("click", () => { elements.speed.value = units.presets[Number(button.dataset.preset)]; }));
elements["units-mph"].addEventListener("click", () => setUnits("mph"));
elements["units-kmh"].addEventListener("click", () => setUnits("kmh"));
navigator.serial?.addEventListener("disconnect", event => { if (event.target === port) disconnect(); });

let savedUnits = "mph";
try { savedUnits = localStorage.getItem(UNITS_KEY) || "mph"; } catch (error) {}
elements.speed.value = (SPEED_UNITS[savedUnits] || SPEED_UNITS.mph).presets[0];
units = SPEED_UNITS[savedUnits] || SPEED_UNITS.mph;
setUnits(savedUnits);

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  path = saved.map(([latitude, longitude]) => L.latLng(latitude, longitude));
  if (path.length) {
    updatePathInfo();
    map.fitBounds(pathLine.getBounds(), { padding: [40, 40] });
  }
} catch (error) {}
</script>
</body>
</html>
